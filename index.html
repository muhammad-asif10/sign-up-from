<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-container">
      <div class="side-image">
        <img id="img" src="img/image.jpg" alt="" />
      </div>
      <div class="header">
        <p>
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quaerat
          ducimus corrupti minima aperiam vitae obcaecati numquam consequuntur
          tempora ab non vero sint consectetur quod est pariatur explicabo,
          perspiciatis amet ratione.
        </p>
        <p>Sign up to get started</p>
        <br />
        <p>You know you want it</p>
        <br />
        <div class="detail">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" />
          <label for="last-name">Last Name&emsp;&nbsp;&nbsp;&nbsp;&emsp;</label>
          <input type="text" id="last-name" /><br />
          <label for="email">Email&emsp;&emsp;&nbsp;&nbsp;</label>
          <input type="email" name="email" id="mail" />
          <label for="phone-number">Phone Number&emsp;</label>
          <input type="number" name="phone-number" id="number" /><br />
          <label for="password">Password&nbsp;&nbsp;</label>
          <input type="password" name="passcord" id="key" />
          <label for="confirm-password">Confirm Password</label>
          <input type="password" name="confirm-passcord" id="key" /><br /><br />
          <button id="sign-up">Create Account</button>
        </div>
      </div>
    </main>
  </body>
</html>
